version: '3.8'

services:
  # Base de datos vectorial Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_rutaia
    ports:
      - "6333:6333" # Puerto HTTP REST API
      - "6334:6334" # Puerto gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Motor n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_rutaia
    ports:
      - "5678:5678" # Puerto de la interfaz de n8n
    environment:
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  qdrant_storage:
  n8n_data: